[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtbap"
version = "0.1.0"
description = "PSA Vehicle Transmission Behaviour Analysis Platform"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "fpdf2>=2.7",
    "rich>=13.0",
]

[project.scripts]
vtbap = "vtbap.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
